name: PolicyForge tests

# Backend: the domain models, simulator, evaluation, compiler, registry and API. Lint with ruff, type-check with
# mypy --strict, require 80 % coverage, and check the exported JSON Schemas match the models (the Studio reads them).
# Studio: TypeScript strict, Vitest over the shared broken-network fixtures, the build, and Playwright end to end
# against the real API (FoodNet rebuilt from scratch, errors in place, undo/redo, versions, scenarios).
on:
  push:
    paths:
      - 'policyforge/**'
      - '.github/workflows/policyforge-ci.yml'
  pull_request:
    paths:
      - 'policyforge/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: policyforge/backend

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e ".[dev]"
      - name: Lint, types and tests with coverage, through the Makefile (as `make test-backend`)
        run: make -C .. test-backend PY=python
      - name: Exported schemas are up to date
        run: python -m core.domain.schema_export && git diff --exit-code -- schemas data ../docs/DSL_REFERENCE.md

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: policyforge/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: policyforge/frontend/package-lock.json
      - run: pip install -e ".[dev]"
        working-directory: policyforge/backend
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          PF_PYTHON: python

  # The brief's "docker-compose up works on a clean machine": a fresh runner builds both images from source, starts
  # the stack, and runs the browser tests (the §10 demo included) against it through nginx.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: policyforge
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The app and the API answer through the proxy
        run: |
          curl -fsS http://localhost:8080/health
          curl -fsS http://localhost:8080/app/ | grep -q '<div id="root">'
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:8080/ | grep -q 302
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: policyforge/frontend/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: policyforge/frontend
      - name: Browser tests against the containers
        run: npx playwright test
        working-directory: policyforge/frontend
        env:
          PF_BASE_URL: http://localhost:8080
      - name: The agent reads its mandate
        run: curl -fsS http://localhost:8080/agents/sourcing-agent-01/mandate | grep -q '"status":"active"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

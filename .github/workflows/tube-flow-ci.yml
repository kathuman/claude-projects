name: Tube Flow tests

# The CPU solver's validation tests (exact solutions, published results, conservation, grid convergence).
# The GPU parity tests need a WebGPU-capable browser and run locally (tube-flow-sim/tests/gpu.test.js).
on:
  push:
    paths:
      - 'tube-flow-sim/**'
      - '.github/workflows/tube-flow-ci.yml'
  pull_request:
    paths:
      - 'tube-flow-sim/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: tube-flow-sim

jobs:
  solver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Solver tests (bodies, STL, inflows, wings)
        run: node tests/lbm.test.js
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validation suite incl. grid convergence (the report's cases; results not rewritten)
        run: node tests/validation.test.js poiseuille stokes-k momentum stl pulse conv-poiseuille conv-stokes
      - name: Syntax-check the browser modules
        run: |
          for f in src/*.js; do node --check "$f"; done

name: balancebot-sim CI

on:
  push:
    paths:
      - 'balancebot-sim/**'
  pull_request:
    paths:
      - 'balancebot-sim/**'

defaults:
  run:
    working-directory: balancebot-sim

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: Syntax-check browser-only modules
        run: |
          for f in web/js/*.mjs; do node --check "$f"; done

name: Tierwise tests

# The planning engine: the calendar, seasons in both hemispheres, the bill of materials chain, yields, lead-time and
# release-time phasing, conservation, safety stock, sourcing shares, expansions and outages, the example scenarios,
# tracing and the capacity to add; file loading; the Spanish and Danish translations; and the tutorial's claims.
on:
  push:
    paths:
      - 'tierwise/**'
      - '.github/workflows/tierwise-ci.yml'
  pull_request:
    paths:
      - 'tierwise/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tierwise/tests/plan.test.js
      - run: node tierwise/tests/io.test.js
      - run: node tierwise/tests/i18n.test.js
      - run: node tierwise/tests/tour.test.js
      - name: Syntax-check the page scripts
        run: for f in tierwise/src/*.js tierwise/*.js; do node --check "$f"; done
        shell: bash

name: Tierwise tests

# The planning engine: the calendar, seasons in both hemispheres, the bill of materials chain, yields, lead-time and
# release-time phasing, conservation, safety stock, sourcing shares, expansions and outages, and the example scenarios.
on:
  push:
    paths:
      - 'tierwise/**'
      - '.github/workflows/tierwise-ci.yml'
  pull_request:
    paths:
      - 'tierwise/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tierwise/tests/plan.test.js
      - name: Syntax-check the page scripts
        run: for f in tierwise/src/plan.js tierwise/src/network.js tierwise/app.js; do node --check "$f"; done
        shell: bash

name: Tierwise tests

# The planning engine: the calendar, seasons in both hemispheres, the bill of materials chain, yields, lead-time and
# release-time phasing, conservation, safety stock, sourcing shares, expansions and outages, the example scenarios,
# tracing and the capacity to add; file loading; the Spanish and Danish translations; the tutorial's claims; and the
# plan within capacity, solved with HiGHS (known answers on small chains, the rules every solution keeps, the example).
on:
  push:
    paths:
      - 'tierwise/**'
      - '.github/workflows/tierwise-ci.yml'
  pull_request:
    paths:
      - 'tierwise/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tierwise/tests/plan.test.js
      - run: node tierwise/tests/io.test.js
      - run: node tierwise/tests/i18n.test.js
      - run: node tierwise/tests/tour.test.js
      - name: The plan within capacity (HiGHS)
        run: npm install --no-save --no-package-lock highs@1.15.3 && node tests/constrained.test.js
        working-directory: tierwise
      - name: Syntax-check the page scripts
        run: for f in tierwise/src/*.js tierwise/*.js; do node --check "$f"; done
        shell: bash

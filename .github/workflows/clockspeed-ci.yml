name: Clockspeed Balancing tests

# The strategy-misalignment model: steady state, exact accounting, the three clock speeds, the promise ratchet, the
# cost of an unsupported push and the value of pacing, firefighting and the capability trap, complexity, resilience,
# the scenarios, the debrief, and the no-free-lunch search (no strategy set once may beat steering); then the cockpit
# page itself in a simulated DOM: take-off, advance, undo, landing, debrief, files, resume.
on:
  push:
    paths:
      - 'clockspeed/**'
      - '.github/workflows/clockspeed-ci.yml'
  pull_request:
    paths:
      - 'clockspeed/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node clockspeed/tests/model.test.js
      - name: Install jsdom for the cockpit checks
        run: npm install --no-save --no-package-lock jsdom@24
      - run: node clockspeed/tests/cockpit.test.js
      - name: Syntax-check the page scripts
        run: for f in clockspeed/src/model.js clockspeed/app.js; do node --check "$f"; done
        shell: bash

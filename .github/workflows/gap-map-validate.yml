name: AI Expectations Gap Map tests

# Data files, the signal pipeline (offline fixture) and the projection model of ai-expectations-gap-map/.
on:
  push:
    paths:
      - 'ai-expectations-gap-map/**'
      - '.github/workflows/gap-map-validate.yml'
  pull_request:
    paths:
      - 'ai-expectations-gap-map/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ai-expectations-gap-map

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate data files
        run: python scripts/validate_data.py
      - name: Pipeline tests
        run: python -m unittest discover -s tests -v
      - name: Model tests
        run: node --test tests/model.test.mjs tests/accuracy.test.mjs

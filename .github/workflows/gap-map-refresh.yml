name: AI Expectations Gap Map signal refresh

# Collects the month's attention and usage signals for ai-expectations-gap-map/, opens a pull request (kept as the
# record of the update, with its summary) and merges it straight away, which republishes the site.
# Every update is also kept in the repo: data/ledger.json (frozen forecasts per period), data/history.json
# (snapshots) and data/updates/<period>.md (the summary). Analyst scores are re-reviewed by the quarterly issue.
on:
  schedule:
    - cron: "17 5 3 * *"   # 05:17 UTC on the 3rd of every month
  workflow_dispatch:
    inputs:
      end_month:
        description: "Last complete month to report (YYYY-MM). Blank = previous month."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  pages: write

defaults:
  run:
    working-directory: ai-expectations-gap-map

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Collect signals
        env:
          SIGNALS_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.end_month }}" ]; then ARGS="--end ${{ inputs.end_month }}"; fi
          python scripts/update_signals.py $ARGS --summary refresh-summary.md
      - name: Freeze this month's forecasts (track record)
        run: node scripts/record_forecast.mjs --summary refresh-summary.md
      - name: Find rising terms not on the board (advisory, never fails the refresh)
        run: python scripts/discover_candidates.py ${{ inputs.end_month && format('--end {0}', inputs.end_month) || '' }} --summary refresh-summary.md
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Read period
        id: period
        run: echo "label=$(python -c "import json;print(json.load(open('data/signals.json'))['period'])")" >> "$GITHUB_OUTPUT"
      - name: Keep the summary as a record of this update
        run: mkdir -p data/updates && cp refresh-summary.md "data/updates/${{ steps.period.outputs.label }}.md"
      - name: Open pull request
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: gap-map-data-refresh/${{ steps.period.outputs.label }}
          delete-branch: true
          add-paths: |
            ai-expectations-gap-map/data/signals.json
            ai-expectations-gap-map/data/history.json
            ai-expectations-gap-map/data/ledger.json
            ai-expectations-gap-map/data/candidates.json
            ai-expectations-gap-map/data/updates/*.md
          commit-message: "AI Expectations Gap Map data: signal refresh for ${{ steps.period.outputs.label }}"
          title: "AI Expectations Gap Map data: signal refresh for ${{ steps.period.outputs.label }}"
          body-path: ai-expectations-gap-map/refresh-summary.md
          labels: data-refresh
      - name: Merge it (the data was validated above)
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.pr.outputs.pull-request-number }} --merge --delete-branch --repo ${{ github.repository }}
      - name: Rebuild the site
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds || echo "Pages build request failed; the next push will publish it."

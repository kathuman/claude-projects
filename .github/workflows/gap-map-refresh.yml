name: AI Expectations Gap Map signal refresh

# Collects the month's attention and usage signals for ai-expectations-gap-map/ and opens a pull request to review.
# Merging it to main republishes the site.
on:
  schedule:
    - cron: "17 5 3 * *"   # 05:17 UTC on the 3rd of every month
  workflow_dispatch:
    inputs:
      end_month:
        description: "Last complete month to report (YYYY-MM). Blank = previous month."
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    working-directory: ai-expectations-gap-map

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect signals
        env:
          SIGNALS_CONTACT: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.end_month }}" ]; then ARGS="--end ${{ inputs.end_month }}"; fi
          python scripts/update_signals.py $ARGS --summary refresh-summary.md
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Read period
        id: period
        run: echo "label=$(python -c "import json;print(json.load(open('data/signals.json'))['period'])")" >> "$GITHUB_OUTPUT"
      - name: Open pull request for review
        uses: peter-evans/create-pull-request@v7
        with:
          branch: gap-map-data-refresh/${{ steps.period.outputs.label }}
          delete-branch: true
          add-paths: |
            ai-expectations-gap-map/data/signals.json
            ai-expectations-gap-map/data/history.json
          commit-message: "AI Expectations Gap Map data: signal refresh for ${{ steps.period.outputs.label }}"
          title: "AI Expectations Gap Map data: signal refresh for ${{ steps.period.outputs.label }}"
          body-path: ai-expectations-gap-map/refresh-summary.md
          labels: data-refresh

<text x="250.00" y="163.80" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="'IBM Plex Mono', 'Consolas', monospace">confirmed in design.</text>
<text x="250.00" y="168.00" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="'IBM Plex Mono', 'Consolas', monospace">3. Bolting pattern to the blade and the pitch-link pin are not in</text>

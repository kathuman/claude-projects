<text x="250.00" y="53.00" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="'IBM Plex Mono', 'Consolas', monospace">3. Flatness 2 mm over the plate; position of each vane ±3 mm, angle</text>
<text x="250.00" y="56.20" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="'IBM Plex Mono', 'Consolas', monospace">±0.5°, checked against the bulb axis before welding.</text>

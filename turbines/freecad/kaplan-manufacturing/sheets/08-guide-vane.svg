<text x="250.00" y="38.20" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="'IBM Plex Mono', 'Consolas', monospace">plasma or waterjet; edges ground to R 3.</text>
<text x="250.00" y="42.40" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="'IBM Plex Mono', 'Consolas', monospace">2. 8 off, at 45° spacing about the runner axis; welded both sides</text>
<text x="250.00" y="45.60" font-size="2.3" text-anchor="start" font-weight="400" fill="#111" font-family="'IBM Plex Mono', 'Consolas', monospace">to the bulb and the duct with fillet welds a = 8, EN ISO 5817 level</text>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Projects Built with Claude</title>
  <meta name="description" content="A running collection of projects built together with Claude." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand">
        <span class="brand-mark">✳</span>
        <span class="brand-text">Claude Projects</span>
      </div>
      <div class="header-actions">
        <a class="gh-link" id="ghProfileLink" href="#" target="_blank" rel="noopener">
          <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
          <span id="ghProfileHandle">@kathuman</span>
        </a>
        <button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme" title="Toggle theme">
          <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <h1>Things I've built with Claude</h1>
      <p class="hero-sub">A living log of apps, scripts, and experiments made in collaboration with Claude — from quick one-offs to full projects.</p>
      <div class="stats" id="stats" aria-live="polite"></div>
    </section>

    <section class="controls">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="searchInput" type="search" placeholder="Search projects…" aria-label="Search projects" />
      </div>
      <div class="tag-filters" id="tagFilters" role="group" aria-label="Filter by tag"></div>
    </section>

    <section id="grid" class="grid" aria-live="polite"></section>

    <p id="emptyState" class="empty-state" hidden>No projects match that search.</p>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="consult">Open to consulting engagements — <a href="https://github.com/kathuman" target="_blank" rel="noopener">get in touch</a></p>
      <p>Built with <a href="https://claude.com" target="_blank" rel="noopener">Claude</a> · Source on <a id="repoLink" href="#" target="_blank" rel="noopener">GitHub</a></p>
    </div>
  </footer>

  <template id="cardTemplate">
    <article class="card">
      <div class="card-top">
        <h3 class="card-title"></h3>
        <span class="card-date"></span>
      </div>
      <p class="card-desc"></p>
      <div class="card-tags"></div>
      <div class="card-links"></div>
    </article>
  </template>

  <script src="assets/app.js"></script>
</body>
</html>

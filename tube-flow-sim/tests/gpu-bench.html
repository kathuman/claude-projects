<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Sphere benchmark (GPU)</title>
<!-- Long GPU runs of a sphere in nearly unbounded uniform flow (moving-sphere frame, small blockage),
     for comparison with published results; driven by tests/benchmark.js. -->
<script src="../src/lbm.js"></script>
<script src="../src/lbm-gpu.js"></script>
<script>
window.bench = async function (o) {
  const gpu = await TF.gpuAvailable();
  if (!gpu) return { error: "no WebGPU" };
  const d = 2 * o.R * o.ratio, u = 0.08, nu = u * d / o.Re;
  const G = await TF.GPUSolver.create(gpu.device, { R: o.R, length: o.length, ratio: o.ratio, sphereX: o.sphereX || 0.3, mode: o.mode || "moving", u: u, nu: Math.max(nu, TF.NU_MIN), disturbance: "kick" });
  // axis line behind the sphere (for the recirculation length)
  const y = Math.round(G.cy), z = Math.round(G.cz), x0 = Math.ceil(G.sx + G.r), axis = [];
  for (let x = x0; x < G.Nx - 2; x++) axis.push(x + G.Nx * (y + G.Ny * z));
  G.gatherer("axis", axis); G.gatherer("planes", []);
  const every = 25, series = [], t0 = performance.now();
  let rec = 0;
  while (G.t < o.steps) {
    G.step(every);
    const r = await G.read({});
    series.push([G.t, r.force[0], r.force[1], r.force[2]]);
    if (G.t > o.steps * 0.9) {               // recirculation from the last stretch
      let last = -1, a = 0, b = 0;
      for (let k = 0; k < axis.length; k++) { const ux = r.axis[4 * k + 1]; if (ux < 0) { last = k; a = ux; } else if (last >= 0) { b = ux; break; } }
      rec = last < 0 ? 0 : Math.max(0, (x0 + last + (b !== a ? -a / (b - a) : 0)) - (G.sx + G.r)) / d;
    }
  }
  const q = 0.5 * u * u * Math.PI * (d / 2) ** 2, tail = series.slice(Math.floor(series.length * 0.6));
  const cd = tail.reduce((s, v) => s + v[1], 0) / tail.length / q;
  const my = tail.reduce((s, v) => s + v[2], 0) / tail.length, mz = tail.reduce((s, v) => s + v[3], 0) / tail.length;
  const cl = Math.sqrt(tail.reduce((s, v) => s + (v[2] - my) ** 2 + (v[3] - mz) ** 2, 0) / tail.length) / q;
  const clMean = Math.hypot(my, mz) / q;
  // dominant lateral frequency (power of Fy and Fz together)
  let best = 0, bf = 0; const N = tail.length;
  for (let k = 1; k < N / 2; k++) { let p = 0; for (const c of [2, 3]) { const m = c === 2 ? my : mz; let re = 0, im = 0; for (let j = 0; j < N; j++) { const ph = 2 * Math.PI * k * j / N; re += (tail[j][c] - m) * Math.cos(ph); im += (tail[j][c] - m) * Math.sin(ph); } p += re * re + im * im; } if (p > best) { best = p; bf = k; } }
  const St = bf / (N * every) * d / u;
  return { Re: u * d / Math.max(nu, TF.NU_MIN), d: d, nodes: G.cpu.fluid.length, steps: G.t, seconds: (performance.now() - t0) / 1000, cd: cd, clMean: clMean, clRms: cl, St: St, rec: rec };
};
</script>

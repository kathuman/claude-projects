[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policyforge"
version = "0.7.0"
description = "Policy authoring and simulation workbench for supply chain managers who delegate execution to AI agents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6",
  "numpy>=1.26",
  "scipy>=1.12",
  "pyomo>=6.7",
  "highspy>=1.7",
  "anthropic>=2.0",
  "fastapi>=0.115",
  "sqlmodel>=0.0.22",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["core*", "api*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# N802/N803/N806: R, T, N, K, M, S, P, D follow the usual mathematical notation for array dimensions
ignore = ["RUF012", "N802", "N803", "N806"]
allowed-confusables = ["−", "×", "–", "’", "α"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["core", "api"]

[[tool.mypy.overrides]]
module = ["scipy.*", "pyomo.*", "highspy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["core"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

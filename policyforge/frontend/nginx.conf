# The app at /app/, everything else to the API: one origin, so the app finds the API without configuration.
server {
    listen 80;
    server_name _;

    location = / {
        return 302 /app/;
    }

    location /app/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /app/index.html;
        location ~* \.(js|css|json|png|svg)$ {
            expires 7d;
        }
    }

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 900s;   # synchronous evaluations can take minutes
        client_max_body_size 20m;  # networks and CSV uploads
    }
}

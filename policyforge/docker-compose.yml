# PolicyForge: `docker compose up` (or `docker-compose up`), then open http://localhost:8080/
#   api  FastAPI on :8000 (OpenAPI docs at http://localhost:8000/docs), SQLite on the `pfdata` volume
#   web  the app built from source, served by nginx on :8080, API calls proxied to `api`
# The compiler replays recorded answers offline. For Claude: LLM_PROVIDER=anthropic ANTHROPIC_API_KEY=… docker compose up
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: policyforge-api:1.0.0
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-claude-opus-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - pfdata:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: policyforge-web:1.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  pfdata:
